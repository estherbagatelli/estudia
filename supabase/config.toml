# Supabase CLI configuration
# Docs: https://supabase.com/docs/guides/cli/config
# `project_id` is a local identifier only. When you run `supabase link`,
# the CLI stores the real remote project ref separately.
project_id = "estherplanner"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"

[studio]
enabled = true
port = 54323

# Local email testing inbox (Inbucket). Useful to test signup / password recovery
# e-mails without a real SMTP provider while developing locally.
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

# Bucket used by the `attachments` table.
[storage.buckets.attachments]
public = false
file_size_limit = "50MiB"
allowed_mime_types = ["image/*", "application/pdf"]

[auth]
enabled = true
# IMPORTANT: change site_url / additional_redirect_urls to your deployed URL
# in production. These local defaults match `vite dev`.
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false        # set true in prod to require email confirmation
double_confirm_changes = true
secure_password_change = true

# Google OAuth. The secrets are read from environment variables so no key is
# committed to the repo. Set them before `supabase start` / configure in the
# Supabase dashboard for the hosted project (Authentication > Providers > Google).
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
redirect_uri = ""                   # leave empty to use the default Supabase callback

[realtime]
enabled = true

[analytics]
enabled = false
